name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gitscrum
          MYSQL_USER: gitscrum
          MYSQL_PASSWORD: gitscrum
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, xml, dom, zip, bcmath, intl
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: PHP lint sweep
        run: |
          find app resources/views database -name "*.php" -print0 \
            | xargs -0 -n1 php -l

      - name: Configure environment
        run: |
          cp .env.example .env
          sed -i \
            -e 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' \
            -e 's/^DB_DATABASE=.*/DB_DATABASE=gitscrum/' \
            -e 's/^DB_USERNAME=.*/DB_USERNAME=gitscrum/' \
            -e 's/^DB_PASSWORD=.*/DB_PASSWORD=gitscrum/' \
            .env

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -uroot -proot --silent && break
            sleep 2
          done

      - name: Run migrations and seeders
        run: php artisan migrate:fresh --seed --force

      - name: Boot sanity check
        run: php artisan about

      - name: Route smoke check
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 &
          SERVER_PID=$!
          sleep 3
          for path in "/" "/auth/login" "/up"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000$path")
            echo "GET $path -> $code"
            if [ "$code" -ge 500 ]; then
              echo "::error::$path returned $code"
              kill $SERVER_PID
              exit 1
            fi
          done
          kill $SERVER_PID

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: Code style check (non-blocking)
        run: composer check-style
        continue-on-error: true
